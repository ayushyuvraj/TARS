[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gst-agentic-reconciliation-backend"
version = "0.1.0"
description = "Backend for the GST Agentic Reconciliation Workbench POC"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "python-multipart>=0.0.9,<1",
  "pandas>=2.2,<3",
  "openpyxl>=3.1,<4",
  "langgraph>=0.2,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
  "openai>=1.40,<3",
  "rapidfuzz>=3.10,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "pytest-cov>=5,<7",
  "httpx>=0.27,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
